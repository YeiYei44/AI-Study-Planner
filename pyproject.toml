[project]
name = "ai-study-planner"
version = "0.1.0"
description = "AI study planner and tutor that ingests Canvas coursework."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
asp = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
