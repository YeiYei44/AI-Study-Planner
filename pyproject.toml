[project]
name = "ai-study-planner"
version = "0.1.0"
description = "AI study planner and tutor that ingests Canvas coursework."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "anthropic>=0.40",
    "openai>=1.40",
    # Local embeddings (ONNX via fastembed, no torch — ~150MB total vs.
    # sentence-transformers' torch dependency, which would be gigabytes).
    # Always local regardless of which chat backend answers questions:
    # Groq (this project's default chat backend) has no embeddings
    # endpoint at all, and embedding is cheap enough to never need a
    # paid API for it anyway.
    "fastembed>=0.4",
    "numpy>=1.26",
    # Material text extraction — all pure-Python-ish, no heavy native deps.
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# Heavy, compiled, platform-specific — only needed for ASP_LLM_BACKEND=local.
local = ["llama-cpp-python>=0.3"]

# Deliberately no [project.scripts] entry point: that generates an
# asp.exe wrapper in Scripts/ on install, and a newly-created unsigned
# executable is exactly the kind of thing endpoint security on a managed
# device flags. Run the CLI as `python -m app.cli <command>` instead —
# just the interpreter that's already trusted, importing and running a
# module, no new executable created.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
